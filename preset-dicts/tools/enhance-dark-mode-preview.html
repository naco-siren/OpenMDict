// ── Gamma-aware invert table computation ──
function computeGammaInvertTable(gamma, steps = 32) {
  const invGamma = 1.0 / gamma;
  const vals = [];
  for (let i = 0; i <= steps; i++) {
    const x = i / steps;
    const linear = Math.pow(x, gamma);
    const inverted = 1.0 - linear;
    const output = Math.pow(Math.max(0, inverted), invGamma);
    vals.push(output.toFixed(4));
  }
  return vals.join(' ');
}

function updateSVGFilter(gamma) {
  const tableStr = computeGammaInvertTable(gamma, 32);
  document.querySelectorAll('#gamma-invert feFuncR, #gamma-invert feFuncG, #gamma-invert feFuncB').forEach(el => {
    el.setAttribute('tableValues', tableStr);
  });
}

// Initialize with default gamma
let currentGamma = 1.8;
updateSVGFilter(currentGamma);

function gammaInvertValue(srgb, gamma) {
  const x = srgb / 255;
  const linear = Math.pow(x, gamma);
  const inverted = 1.0 - linear;
  const output = Math.pow(Math.max(0, inverted), 1.0 / gamma);
  return Math.round(output * 255);
}

// ── ENHANCE FILTER CSS (injected when invert modes are active) ──

// body{color:#000} mirrors the iOS fix: ArticleHTMLRenderer bakes body color
// as a static rgba() from the current trait collection.  In dark mode the baked
// color is white — the filter inverts white→black → invisible on dark bg.
// Forcing #000 ensures the filter produces white text.
// Apple's secondarySystemGroupedBackground (light) = #F2F2F7.
// Using this instead of pure #fff so the inverted background becomes a
// comfortable dark gray (~#1C1C1E) rather than pure black (#000).

// ── Panel definitions ──
const PANELS = [
  { id: 'gcide', title: 'GCIDE — English monolingual (flat senses, Syn links)', html: GCIDE_ENTRY },
  { id: 'lsj',   title: 'LSJ — Greek-English (3-level nested senses)', html: LSJ_ENTRY },
  { id: 'rawfont', title: 'Third-party sample A (raw <font color>, NO CSS)', html: RAW_FONT_ENTRY, noPresetCSS: true },
  { id: 'inline', title: 'Third-party sample B (inline style, <font color>)', html: INLINE_STYLE_ENTRY, noPresetCSS: true },
  { id: 'jmdict', title: 'JMdict — Japanese-English (accent, pitch marks)', html: JMDICT_ENTRY },
  { id: 'cedict', title: 'CEDICT — Chinese-English (pinyin, traditional)', html: CEDICT_ENTRY },
  { id: 'unihan', title: 'Unihan — CJK (5 color-coded reading tags)', html: UNIHAN_ENTRY },
  { id: 'kanjidic', title: 'KANJIDIC2 — Japanese kanji (readings, metadata)', html: KANJIDIC_ENTRY },
];

// ── Render panels ──
const panelsContainer = document.getElementById('panels');
PANELS.forEach(p => {
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `
    <div class="panel-header">${p.title}</div>
    <div class="panel-body">
      <div class="entry-wrap" id="wrap-${p.id}"></div>
    </div>
  `;
  panelsContainer.appendChild(panel);
});

// ── Algorithm switching ──
const algoInfo = document.getElementById('algo-info');

function applyAlgorithm(algo) {
  // Show/hide gamma slider row
  document.getElementById('gamma-row').style.display = (algo === 'gamma') ? 'flex' : 'none';

  PANELS.forEach(p => {
    const wrap = document.getElementById(`wrap-${p.id}`);
    const css = p.noPresetCSS ? '' : LIGHT_CSS;
    const darkCss = p.noPresetCSS ? '' : DARK_CSS;
    const enhLinear = p.noPresetCSS ? '' : ENHANCE_LINEAR_CSS;
    const enhGamma = p.noPresetCSS ? '' : ENHANCE_GAMMA_CSS;

    if (algo === 'light') {
      wrap.innerHTML = `<style>${css}</style>${p.html}`;
      wrap.style.filter = 'none';
      wrap.style.background = '#fff';
    } else if (algo === 'native') {
      wrap.innerHTML = `<style>${css}@media(prefers-color-scheme:dark){${darkCss}}</style>${p.html}`;
      wrap.style.filter = 'none';
      wrap.style.background = '';
    } else if (algo === 'linear') {
      wrap.innerHTML = `<style>${css}${ENHANCE_BODY_FIX}${enhLinear}</style>${p.html}`;
      wrap.style.filter = 'invert(1) hue-rotate(180deg)';
      wrap.style.background = ENHANCE_BG;
    } else if (algo === 'gamma') {
      wrap.innerHTML = `<style>${css}${ENHANCE_BODY_FIX}${enhGamma}</style>${p.html}`;
      wrap.style.filter = 'url(#gamma-invert) hue-rotate(180deg)';
      wrap.style.background = ENHANCE_BG;
    }
  });

  // Update page chrome
  document.body.classList.toggle('light-mode', algo === 'light');

  updateSwatches(algo);
  updateAlgoDescription(algo);
}

// ── Color computation for swatches ──
function linearInvert(r) { return 255 - r; }

function hexOf(v) {
  const h = Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0');
  return `#${h}${h}${h}`;
}

function updateSwatches(algo) {
  let vals;
  if (algo === 'light') {
    vals = [255, 248, 255, 248];
  } else if (algo === 'native') {
    vals = [28, 44, 28, 44];
  } else if (algo === 'linear') {
    vals = [linearInvert(242), linearInvert(248), linearInvert(242), linearInvert(248)];
  } else {
    vals = [gammaInvertValue(242, currentGamma), gammaInvertValue(248, currentGamma),
            gammaInvertValue(242, currentGamma), gammaInvertValue(248, currentGamma)];
  }

  const ids = ['body', 'sn1', 'sn2', 'sn3'];
  ids.forEach((id, i) => {
    document.getElementById(`sw-${id}`).style.background = hexOf(vals[i]);
    document.getElementById(`sw-${id}-label`).textContent = Math.round(vals[i]);
  });

  const deltas = [];
  for (let i = 1; i < vals.length; i++) {
    deltas.push(Math.abs(vals[i] - vals[i-1]));
  }
  const maxDelta = Math.max(...deltas);
  document.getElementById('sw-delta').textContent = `\u0394max = ${maxDelta}`;
}

function updateAlgoDescription(algo) {
  const descs = {
    light: `<b>Light Mode</b> — 原始亮色模式，所有颜色和层级关系的 baseline。<br>
      背景层级：<code>#fff</code>(255) / <code>#f8f8fa</code>(248)。差值 <b>7</b>，亮色端人眼可辨。`,
    native: `<b>Native Dark CSS</b> — preset dicts 自带的 <code>@media(prefers-color-scheme:dark)</code> 手调配色。<br>
      背景层级：<code>#1c1c1e</code>(28) / <code>#2c2c2e</code>(44)。差值 <b>16</b>，暗色端手调层级清晰。`,
    linear: `<b>Current iOS</b> — <code>overrideUserInterfaceStyle = .light</code> + <code>filter: invert(1) hue-rotate(180deg)</code>。<br>
      线性反转 (gamma=1.0)：255→<b>0</b>，248→<b>7</b>。暗色端差值仅 <b>7</b>，人眼几乎无法区分。`,
  };
  if (algo === 'gamma') {
    const v248 = gammaInvertValue(248, currentGamma);
    algoInfo.innerHTML = `<b>Gamma-aware invert</b> — SVG <code>feComponentTransfer</code>，gamma=<b>${currentGamma.toFixed(1)}</b>。<br>
      255→<b>0</b>，248→≈<b>${v248}</b>。暗色端差值 <b>${v248}</b>。<br>
      <span style="color:#636366">gamma 越高，暗色端层级越分明，但中间色调偏移越大。1.5–2.0 是推荐区间。</span>`;
  } else {
    algoInfo.innerHTML = descs[algo] || '';
  }
}

// ── Wire up controls ──
function getSelectedAlgo() {
  return document.querySelector('input[name="algo"]:checked')?.value || 'native';
}

document.querySelectorAll('input[name="algo"]').forEach(radio => {
  radio.addEventListener('change', () => applyAlgorithm(radio.value));
});

const gammaSlider = document.getElementById('gamma-slider');
const gammaLabel = document.getElementById('gamma-value');
gammaSlider.addEventListener('input', () => {
  currentGamma = parseFloat(gammaSlider.value);
  gammaLabel.textContent = currentGamma.toFixed(1);
  updateSVGFilter(currentGamma);
  // Force re-render: SVG filter content changed but CSS filter reference is the same,
  // so we need to toggle the filter to trigger repaint
  PANELS.forEach(p => {
    const wrap = document.getElementById(`wrap-${p.id}`);
    wrap.style.filter = 'none';
    // Force reflow
    void wrap.offsetHeight;
    wrap.style.filter = 'url(#gamma-invert) hue-rotate(180deg)';
  });
  updateSwatches('gamma');
  updateAlgoDescription('gamma');
});

// ── Initial render ──
applyAlgorithm('native');
</script>
</body>
</html>
